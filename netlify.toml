[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Nessuna build necessaria'"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["nodemailer"]

# Pagina admin: non indicizzare
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/checkin"
  to = "/checkin.html"
  status = 200

[[headers]]
  for = "/checkin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/regolamento"
  to = "/regolamento.html"
  status = 200

# moduli JavaScript (lettura planimetrie PDF)
[[headers]]
  for = "/vendor/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=604800"
