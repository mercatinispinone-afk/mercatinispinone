<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5b1f24">
<title>Check-in · Natale a Spinone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { padding-bottom: 40px; }
  .top { background: var(--maroon); color: var(--cream-2); position: sticky; top: 0; z-index: 5; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .top .in { max-width: 720px; margin: 0 auto; padding: 10px 16px; }
  .top h1 { font-family: var(--head); font-weight: 400; font-size: 22px; margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .top h1 span { color: var(--gold); }
  .top button.esci { font: inherit; font-size: 13px; background: none; border: 1.5px solid var(--cream-2); color: var(--cream-2); border-radius: 6px; padding: 3px 8px; }
  .seg2 { display: flex; margin-top: 8px; border-radius: 8px; overflow: hidden; border: 2px solid var(--gold); }
  .seg2 button { flex: 1; font: inherit; font-weight: 800; padding: 8px; border: 0; background: transparent; color: var(--gold); }
  .seg2 button.on { background: var(--gold); color: var(--maroon); }
  .wrap2 { max-width: 720px; margin: 0 auto; padding: 0 12px; }
  .contatori { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .ct { background: var(--paper); border-radius: 8px; padding: 8px; text-align: center; }
  .ct b { display: block; font-family: var(--head); font-weight: 400; font-size: 26px; color: var(--maroon); line-height: 1.1; }
  .ct small { color: var(--muted); font-size: 12px; }
  .cerca { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
  .filtri { display: flex; gap: 6px; margin: 8px 0 4px; overflow-x: auto; }
  .filtri button { font: inherit; font-size: 14px; font-weight: 800; white-space: nowrap; padding: 6px 12px; border-radius: 99px; border: 2px solid var(--line); background: #fff; color: var(--maroon); }
  .filtri button.on { background: var(--maroon); border-color: var(--maroon); color: #fff; }
  .card { background: #fff; border-radius: 12px; padding: 12px; margin: 10px 0; display: grid; grid-template-columns: 64px 1fr; gap: 12px; border: 2px solid transparent; }
  .card.arr { border-color: #4f6b2c; background: #f4f8ec; }
  .pos { width: 64px; height: 64px; border-radius: 10px; display: grid; place-items: center; font-family: var(--head); font-size: 26px; color: #fff; background: var(--maroon); line-height: 1; text-align: center; }
  .pos.nessuna { background: #ccc; font-size: 12px; font-family: var(--body); font-weight: 800; color: #555; }
  .pos small { display: block; font-family: var(--body); font-size: 10px; font-weight: 800; opacity: .9; }
  .nome { font-weight: 800; font-size: 18px; color: var(--ink); }
  .merce { color: var(--muted); font-size: 14px; margin: 2px 0 6px; }
  .bdg { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 99px; padding: 1px 8px; margin: 0 4px 4px 0; background: #efe2c2; color: var(--maroon); }
  .bdg.red { background: #a3222f; color: #fff; }
  .bdg.ok { background: #4f6b2c; color: #fff; }
  .azioni { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
  .azioni button, .azioni a { font: inherit; font-weight: 800; font-size: 15px; border-radius: 10px; padding: 11px 14px; border: 2px solid var(--line); background: #fff; color: var(--maroon); text-decoration: none; flex: 1 1 auto; text-align: center; }
  .azioni .arrivo { background: #4f6b2c; border-color: #4f6b2c; color: #fff; flex: 2 1 100%; font-size: 17px; }
  .azioni .fatto { background: #e3ecd2; border-color: #4f6b2c; color: #33501a; }
  .azioni .soldi { border-color: #f09a2e; color: #7a4510; }
  .vuoto { text-align: center; color: var(--muted); padding: 30px 0; }
  .pinbox { max-width: 360px; margin: 60px auto; background: var(--paper); padding: 24px; border-radius: 12px; text-align: center; }
  .pinbox input { width: 100%; font: inherit; font-size: 24px; letter-spacing: .3em; text-align: center; padding: 10px; border: 2px solid var(--line); border-radius: 10px; margin: 10px 0; }
  .agg { text-align: center; font-size: 12px; color: var(--muted); margin: 10px 0; }
</style>
</head>
<body>
<div class="top"><div class="in">
  <h1><div>Check-in · <span>Natale a Spinone</span></div><button class="esci" id="esci" hidden>Esci</button></h1>
  <div class="seg2" id="giorni" hidden><button data-g="sab" type="button">Sabato 5</button><button data-g="dom" type="button">Domenica 6</button></div>
</div></div>

<form class="pinbox" id="pinForm">
  <h2>Accesso staff</h2>
  <p class="hint">Inserisci il PIN che ti ha dato l'organizzazione.</p>
  <input type="password" id="pin" inputmode="numeric" autocomplete="off" required>
  <div class="form-error" id="pinErr"></div>
  <button class="btn" type="submit" style="width:100%">Entra</button>
</form>

<main class="wrap2" id="app" hidden>
  <div class="contatori">
    <div class="ct"><b id="cArr">0/0</b><small>arrivati</small></div>
    <div class="ct"><b id="cPag">0</b><small>quote da incassare</small></div>
    <div class="ct"><b id="cEuro">€ 0</b><small>incassato in loco</small></div>
  </div>
  <input type="search" class="cerca" id="q" placeholder="Cerca nome, postazione o merce…" autocomplete="off">
  <div class="filtri" id="filtri">
    <button data-f="tutti" class="on" type="button">Tutti</button>
    <button data-f="mancanti" type="button">Da arrivare</button>
    <button data-f="arrivati" type="button">Arrivati</button>
    <button data-f="pagare" type="button">Da pagare</button>
    <button data-f="corrente" type="button">⚡ Corrente</button>
  </div>
  <div id="lista"></div>
  <p class="agg" id="agg"></p>
</main>

<script src="/checkin.js"></script>
</body>
</html>
